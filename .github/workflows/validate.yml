name: Validate research artifact

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/validate_notebook.py
      - run: python -m py_compile src/deepfake_detection_pipeline.py
